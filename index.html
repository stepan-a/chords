<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page_title">Accords pour guitare</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
      color: #1c1c1e;
      background: #fafafa;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }
    .lang-switcher {
      display: flex;
      gap: 2px;
      margin-top: 4px;
    }
    .lang-switcher button {
      padding: 4px 10px;
      border: 1px solid #bbb;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: #444;
      font-weight: 500;
    }
    .lang-switcher button.active {
      background: #1c1c1e;
      color: white;
      border-color: #1c1c1e;
    }
    .lead {
      color: #555;
      margin: 0 0 20px;
      font-size: 14px;
    }
    code {
      background: #eee;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .controls {
      background: white;
      padding: 16px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: max-content 1fr max-content 1fr;
      gap: 10px 12px;
      align-items: center;
    }
    .controls label.title {
      font-size: 13px;
      color: #444;
      font-weight: 500;
    }
    input[type="text"], select {
      padding: 6px 10px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: white;
      box-sizing: border-box;
      width: 100%;
    }
    input[type="text"]:focus, select:focus {
      outline: 2px solid #4a90e2;
      outline-offset: -1px;
      border-color: transparent;
    }
    .radio-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 16px;
      font-size: 13px;
      align-items: center;
    }
    .radio-group > span:first-child {
      color: #444;
      font-weight: 500;
    }
    .radio-group label {
      cursor: pointer;
      user-select: none;
    }
    #voicings {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }
    .chord-slot {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .chord-slot.expanded {
      background: #f3f6fb;
      border-color: #c4d4ee;
    }
    .voicing {
      display: flex;
      justify-content: center;
      border-radius: 4px;
      transition: background-color 0.1s, transform 0.1s;
    }
    .voicing svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .voicing.active {
      cursor: pointer;
      padding: 2px;
      border: 2px solid transparent;
    }
    .voicing.active:hover {
      border-color: #4a90e2;
    }
    .chord-slot.expanded .voicing.active {
      border-color: #4a90e2;
    }
    .voicing.alternative {
      cursor: pointer;
      padding: 2px;
      border: 2px solid transparent;
      opacity: 0.7;
    }
    .voicing.alternative:hover {
      opacity: 1;
      border-color: #4a90e2;
    }
    .alternatives {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 4px;
      width: 100%;
      padding-top: 6px;
      border-top: 1px solid #d4dceb;
    }
    .slot-notes {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: #555;
    }
    .chord-error {
      padding: 16px;
      text-align: center;
      color: #888;
    }
    .chord-error-symbol {
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 4px;
      font-size: 16px;
    }
    .chord-error-message {
      font-size: 12px;
      color: #c00;
    }
    #loading {
      padding: 24px;
      text-align: center;
      color: #888;
      font-style: italic;
      background: white;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }
    #loading.hidden { display: none; }
    .empty {
      color: #888;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h1 data-i18n="h1">Accords pour guitare</h1>
    <div class="lang-switcher" role="group" aria-label="Language">
      <button type="button" data-lang="fr" class="active">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <p class="lead" data-i18n="lead_html">
    Symbole d'accord en notation anglo-saxonne (ex. <code>Cmaj7</code>,
    <code>F#m7b5</code>, <code>D/F#</code>, <code>Bbm9</code>).
  </p>

  <div class="controls">
    <label class="title" for="chord-input" data-i18n="chord_label">Accords</label>
    <input type="text" id="chord-input" value="Am F C G" autocomplete="off"
           spellcheck="false" autocapitalize="off">

    <label class="title" for="tuning-select" data-i18n="tuning_label">Accordage</label>
    <select id="tuning-select">
      <!-- Pre-populated as plain names so the dropdown is usable before
           PyScript loads. PyScript rebuilds with the open-string pitches
           appended (e.g. "Standard (E A D G B E)"). -->
      <option value="Standard">Standard</option>
      <option value="Drop D">Drop D</option>
      <option value="Drop C">Drop C</option>
      <option value="DADGAD">DADGAD</option>
      <option value="Open G">Open G</option>
      <option value="Open D">Open D</option>
      <option value="Open E">Open E</option>
      <option value="Open C">Open C</option>
      <option value="Eb Standard">Eb Standard</option>
      <option value="D Standard">D Standard</option>
    </select>

    <div class="radio-group">
      <span data-i18n="labels_legend">Étiquettes :</span>
      <label><input type="radio" name="label-mode" value="fingers" checked>
        <span data-i18n="label_fingers">Doigts</span></label>
      <label><input type="radio" name="label-mode" value="degrees">
        <span data-i18n="label_degrees">Degrés (romains)</span></label>
      <label><input type="radio" name="label-mode" value="notes">
        <span data-i18n="label_notes">Notes</span></label>
      <label><input type="radio" name="label-mode" value="none">
        <span data-i18n="label_none">Aucune</span></label>
    </div>
  </div>

  <div id="loading" data-i18n="loading">Chargement du moteur Python (~10 Mo, mis en cache ensuite)…</div>
  <div id="voicings"></div>

  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>

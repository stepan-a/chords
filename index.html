<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page_title">Accords pour guitare</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
      color: #1c1c1e;
      background: #fafafa;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .lang-switcher {
      display: flex;
      gap: 2px;
    }
    .lang-switcher button,
    #share-button {
      padding: 4px 10px;
      border: 1px solid #bbb;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: #444;
      font-weight: 500;
    }
    .lang-switcher button.active {
      background: #1c1c1e;
      color: white;
      border-color: #1c1c1e;
    }
    #share-button:hover {
      background: #f3f6fb;
      border-color: #4a90e2;
      color: #1c1c1e;
    }
    #share-feedback {
      font-size: 12px;
      color: #2e7d32;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #share-feedback.visible {
      opacity: 1;
    }
    #share-feedback.error {
      color: #c00;
    }
    .lead {
      color: #555;
      margin: 0 0 20px;
      font-size: 14px;
    }
    code {
      background: #eee;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .controls {
      background: white;
      padding: 16px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: max-content 1fr max-content 1fr;
      gap: 10px 12px;
      align-items: center;
    }
    .controls label.title {
      font-size: 13px;
      color: #444;
      font-weight: 500;
    }
    input[type="text"], select {
      padding: 6px 10px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: white;
      box-sizing: border-box;
      width: 100%;
    }
    input[type="text"]:focus, select:focus {
      outline: 2px solid #4a90e2;
      outline-offset: -1px;
      border-color: transparent;
    }
    .radio-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 16px;
      font-size: 13px;
      align-items: center;
    }
    .radio-group > span:first-child {
      color: #444;
      font-weight: 500;
    }
    .radio-group label {
      cursor: pointer;
      user-select: none;
    }
    .toggle-row {
      grid-column: 1 / -1;
      display: flex;
      gap: 16px;
      font-size: 13px;
      align-items: center;
    }
    .toggle-row label {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-row input[type="checkbox"] {
      accent-color: #1c1c1e;
      cursor: pointer;
    }
    .slider-with-value {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-with-value input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #1c1c1e;
    }
    .slider-with-value output {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
      color: #444;
      min-width: 2ch;
      text-align: right;
    }
    #voicings {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }
    .chord-slot {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .chord-slot.expanded {
      background: #f3f6fb;
      border-color: #c4d4ee;
    }
    .voicing {
      display: flex;
      justify-content: center;
      border-radius: 4px;
      transition: background-color 0.1s, transform 0.1s;
    }
    .voicing svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .voicing.active {
      cursor: pointer;
      padding: 2px;
      border: 2px solid transparent;
    }
    .voicing.active:hover {
      border-color: #4a90e2;
    }
    .chord-slot.expanded .voicing.active {
      border-color: #4a90e2;
    }
    .voicing.alternative {
      cursor: pointer;
      padding: 2px;
      border: 2px solid transparent;
      opacity: 0.7;
    }
    .voicing.alternative:hover {
      opacity: 1;
      border-color: #4a90e2;
    }
    .alternatives {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 4px;
      width: 100%;
      padding-top: 6px;
      border-top: 1px solid #d4dceb;
    }
    .slot-notes {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: #555;
    }
    .chord-error {
      padding: 16px;
      text-align: center;
      color: #888;
    }
    .chord-error-symbol {
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 4px;
      font-size: 16px;
    }
    .chord-error-message {
      font-size: 12px;
      color: #c00;
    }
    #loading {
      padding: 24px;
      text-align: center;
      color: #888;
      font-style: italic;
      background: white;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }
    #loading.hidden { display: none; }
    .empty {
      color: #888;
      padding: 24px;
      text-align: center;
    }

    /* ---- Tap feedback ----
       :hover only fires for pointing devices; :active fires on press
       (mouse) AND on tap (touch), so this is what lights up under a
       fingertip on a phone. Subtle on purpose. */
    .lang-switcher button:active {
      opacity: 0.75;
    }
    .voicing.active:active,
    .voicing.alternative:active {
      background-color: #e8eef7;
      transform: scale(0.98);
    }

    /* ---- Mobile layout ----
       One breakpoint at 720px catches phones in either orientation and
       tablets in portrait. */
    @media (max-width: 720px) {
      body {
        padding: 16px;
      }
      h1 {
        font-size: 20px;
      }
      .lead {
        font-size: 13px;
      }

      /* Stack control rows vertically: label on top, control below. */
      .controls {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 12px 14px;
      }
      .controls label.title {
        margin-top: 6px;
        margin-bottom: -2px;
      }

      /* iOS Safari zooms the viewport as soon as a focused input has a
         font-size under 16px. Bumping all text controls to 16px keeps
         the page steady when the user taps the chord field. */
      input[type="text"],
      select {
        font-size: 16px;
        padding: 10px 12px;
      }

      /* Larger language-switcher and share buttons (Apple HIG /
         Material both recommend ~44 px tall touch targets). */
      .lang-switcher button,
      #share-button {
        padding: 8px 14px;
        font-size: 14px;
      }

      /* Radio labels need padding for thumb-friendly tapping. */
      .radio-group,
      .toggle-row {
        flex-wrap: wrap;
        gap: 10px 14px;
      }
      .radio-group label,
      .toggle-row label {
        padding: 4px 0;
      }

      /* Slider thumb easier to grab. */
      input[type="range"] {
        height: 28px;
      }

      /* Collapsed chord tiles: two per row on a phone (~360–430 px
         wide). When a tile expands to show alternatives, let it take
         the full width so the grid of alternatives stays readable. */
      #voicings {
        gap: 10px;
      }
      .chord-slot {
        max-width: calc(50% - 5px);
        box-sizing: border-box;
      }
      .chord-slot.expanded {
        max-width: 100%;
        width: 100%;
      }
      .chord-slot .voicing svg {
        width: 100%;
      }
      /* On a phone the alternatives grid wants only two columns. */
      .alternatives {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h1 data-i18n="h1">Accords pour guitare</h1>
    <div class="header-actions">
      <span id="share-feedback" aria-live="polite"></span>
      <button type="button" id="share-button" data-i18n="share_label">Partager</button>
      <div class="lang-switcher" role="group" aria-label="Language">
        <button type="button" data-lang="fr" class="active">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <p class="lead" data-i18n="lead_html">
    Symbole d'accord en notation anglo-saxonne (ex. <code>Cmaj7</code>,
    <code>F#m7b5</code>, <code>D/F#</code>, <code>Bbm9</code>).
  </p>

  <div class="controls">
    <label class="title" for="chord-input" data-i18n="chord_label">Accords</label>
    <input type="text" id="chord-input" value="Am F C G" autocomplete="off"
           spellcheck="false" autocapitalize="off">

    <label class="title" for="tuning-select" data-i18n="tuning_label">Accordage</label>
    <select id="tuning-select">
      <!-- Pre-populated as plain names so the dropdown is usable before
           PyScript loads. PyScript rebuilds with the open-string pitches
           appended (e.g. "Standard (E A D G B E)"). -->
      <option value="Standard">Standard</option>
      <option value="Drop D">Drop D</option>
      <option value="Drop C">Drop C</option>
      <option value="DADGAD">DADGAD</option>
      <option value="Open G">Open G</option>
      <option value="Open D">Open D</option>
      <option value="Open E">Open E</option>
      <option value="Open C">Open C</option>
      <option value="Eb Standard">Eb Standard</option>
      <option value="D Standard">D Standard</option>
    </select>

    <div class="radio-group">
      <span data-i18n="labels_legend">Étiquettes :</span>
      <label><input type="radio" name="label-mode" value="fingers" checked>
        <span data-i18n="label_fingers">Doigts</span></label>
      <label><input type="radio" name="label-mode" value="degrees">
        <span data-i18n="label_degrees">Degrés (romains)</span></label>
      <label><input type="radio" name="label-mode" value="notes">
        <span data-i18n="label_notes">Notes</span></label>
      <label><input type="radio" name="label-mode" value="none">
        <span data-i18n="label_none">Aucune</span></label>
    </div>

    <div class="toggle-row">
      <label><input type="checkbox" id="inversions-toggle">
        <span data-i18n="inversions_label">Renversements</span></label>
    </div>

    <label class="title" for="positions-slider" data-i18n="positions_label">Positions</label>
    <div class="slider-with-value">
      <input type="range" id="positions-slider" min="1" max="16" value="8" step="1">
      <output for="positions-slider">8</output>
    </div>

    <label class="title" for="variety-slider" data-i18n="variety_label">Variété</label>
    <div class="slider-with-value">
      <input type="range" id="variety-slider" min="0" max="12" value="5" step="1">
      <output for="variety-slider">5</output>
    </div>
  </div>

  <div id="loading" data-i18n="loading">Chargement du moteur Python (~10 Mo, mis en cache ensuite)…</div>
  <div id="voicings"></div>

  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
